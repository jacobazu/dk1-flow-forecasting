# one-off: the flow forecasts for the days between the backtest and the first live forecast, made afterwards with only what
# was published before each auction (scripts/05_backfill.R). kept in forecasts/flow_backfill.csv, apart from the live record

name: Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ubuntu mirrors
        run: |
          printf 'http://ftp.uni-stuttgart.de/ubuntu/\nhttp://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 25
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2, any::xml2, any::dplyr, any::tidyr, any::readr, any::lubridate, any::glmnet
          install-pandoc: false

      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: flows-v1-${{ github.run_id }}
          restore-keys: flows-v1-
          fail-on-cache-miss: true

      - name: Backfill
        run: Rscript scripts/05_backfill.R

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts
          git diff --cached --quiet && exit 0
          git commit -m "backfilled flow forecasts"
          for try in 1 2 3; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
