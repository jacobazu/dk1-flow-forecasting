# which flow data exists, saved to results/data_check.csv

name: Data check

on:
  push:
    branches: [main]
    paths: ["scripts/00_data_check.R", ".github/workflows/data_check.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # github's own ubuntu mirror has been failing since late oct 2026
      - name: Ubuntu mirrors
        run: |
          printf 'http://ftp.uni-stuttgart.de/ubuntu/\nhttp://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 25
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2, any::dplyr, any::readr, any::lubridate
          install-pandoc: false

      - name: Check
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: Rscript scripts/00_data_check.R

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/data_check.csv
          git diff --cached --quiet && exit 0
          git commit -m "data check results"
          git pull --rebase && git push
