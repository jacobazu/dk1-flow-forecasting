<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northern Europe power flows</title>
<meta name="description" content="Price, generation and the flow between Northern Europe's price areas, hour by hour, with tomorrow's forecast for DK1's cables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --paper: #f3f5f7; --card: #ffffff; --ink: #14202b; --muted: #5d6b78; --faint: #93a0ac; --line: #d5dbe1; --hair: #e6eaee;
    --pipe: #9aa6b2; --sel: #0f7c86; --fc: #c2700a;
    --fossil: #cf5a3c; --nuclear: #9a64d6; --solar: #b08a10; --hydro: #2f5fc8; --bio: #2e9a63; --wind: #3aa0d2; --other: #8a949e;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); }
  a { color: var(--sel); }
  button { font-family: inherit; }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 22px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header .when { font: 500 14px var(--mono); }
  header .when em { font-style: normal; color: var(--fc); }
  header .links { margin-left: auto; display: flex; gap: 18px; font-size: 14px; }
  header .links a { color: var(--muted); text-decoration: none; } header .links a:hover { color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--paper); }
  .seg button { font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; }
  .seg button:disabled { opacity: .35; cursor: default; }
  .seg span { font: 12px var(--mono); color: var(--muted); padding: 5px 4px 0 8px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; padding: 20px 24px 8px; max-width: 1500px; margin: 0 auto; }
  .board { background: var(--card); border: 1px solid var(--line); border-radius: 14px; position: relative; height: calc(100vh - 110px); min-height: 560px; max-height: 860px; }
  #map { width: 100%; height: 100%; display: block; }
  .key { position: absolute; left: 18px; bottom: 14px; display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--muted); }
  .key .ramp { width: 120px; height: 8px; border-radius: 4px; }
  aside { display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .zone-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .zone-head h2 { font-size: 28px; font-weight: 600; margin: 0; }
  .zone-head span { color: var(--muted); }
  .price { font: 500 44px/1 var(--mono); margin: 14px 0 2px; font-variant-numeric: tabular-nums; }
  .price small { font-size: 15px; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .pair div { font: 12px var(--mono); color: var(--muted); }
  .pair b { display: block; font: 500 20px var(--mono); color: var(--ink); }
  .mix { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 18px 0 8px; gap: 2px; }
  .mix i { display: block; height: 100%; }
  .mix-key { display: flex; flex-wrap: wrap; gap: 2px 12px; font: 12px var(--mono); color: var(--muted); }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .flows { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px 8px; align-items: baseline; font-size: 14px; }
  .flows .dir { font: 600 14px var(--mono); }
  .flows .v { font: 14px var(--mono); text-align: right; }
  .flows .sub { grid-column: 2 / -1; font: 12px var(--mono); color: var(--muted); margin-top: -4px; }
  .flows .sub b { color: var(--fc); font-weight: 500; }
  .zbtn { all: unset; cursor: pointer; } .zbtn:hover { text-decoration: underline; } .zbtn:focus-visible { outline: 2px solid var(--sel); }
  .label { font: 12px var(--mono); color: var(--muted); margin: 0 0 10px; }
  .record b { font: 500 22px var(--mono); }
  .record p { margin: 4px 0; color: var(--muted); font-size: 13px; }

  .tile rect.bg { stroke: none; }
  .tile { cursor: pointer; }
  .tile .code { font: 600 14px var(--sans); }
  .tile .p { font: 500 13px var(--mono); }
  .tile.sel rect.ring { stroke: var(--ink); stroke-width: 2.5; }
  .tile:focus { outline: none; } .tile:focus-visible rect.ring { stroke: var(--sel); stroke-width: 3; }
  .pipe { fill: none; stroke-linecap: butt; }
  .chev { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mw { font: 500 11.5px var(--mono); fill: var(--ink); }
  .mw-bg { fill: #fff; stroke: var(--line); }

  .timeline { max-width: 1500px; margin: 0 auto; padding: 8px 24px 24px; }
  .tl-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 8px; }
  .tl-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .play { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  #tl { width: 100%; height: 190px; display: block; cursor: crosshair; touch-action: none; }
  #tl text { font: 11px var(--mono); fill: var(--muted); }
  #tl:focus-visible { outline: 2px solid var(--sel); }
  footer { text-align: center; font: 12px var(--mono); color: var(--faint); padding: 0 16px 24px; }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    .board { height: auto; min-height: 0; aspect-ratio: 1 / 1.02; }
    header { padding: 12px 16px; } header .links { margin-left: 0; }
    .timeline { padding: 0 16px 20px; }
  }
</style>
</head>
<body>
<header>
  <h1>Power in Northern Europe</h1>
  <span class="when" id="when"></span>
  <div class="seg" role="group" aria-label="What DK1's cables show" id="mode"><span>DK1 cables</span><button data-mode="measured" class="on">Measured</button><button data-mode="auction">Auction</button><button data-mode="forecast">Forecast</button></div>
  <span class="links"><a href="record.html">Forecast record</a><a href="https://jacobazu.github.io/">jacobazu.github.io</a></span>
</header>
<main>
  <div class="board">
    <svg id="map" role="img" aria-label="Schematic of Northern Europe's price areas, coloured by price, with the power flowing between them"></svg>
    <div class="key" aria-hidden="true"><span>0 €</span><div class="ramp" id="ramp"></div><span>250+ €/MWh</span><span style="margin-left:10px">› direction of flow, width = MW</span></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<section class="timeline">
  <div class="tl-card">
    <div class="tl-head"><button class="play" id="play" aria-label="Play through the hours">▶</button><span class="label" id="tl-title" style="margin:0"></span></div>
    <svg id="tl" tabindex="0" aria-label="Timeline: generation by fuel for the chosen area, and DK1's net export with our forecast. Arrow keys move between hours."></svg>
  </div>
</section>
<footer>Data: ENTSO-E, Energinet, Elexon, via the Rebase Grid API · auction flows from ENTSO-E · forecast saved before each auction</footer>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FUEL_NAMES = { fossil: "fossil", nuclear: "nuclear", solar: "solar", hydro: "hydro", bio: "bio and waste", wind: "wind", other: "other" };
const FUELS = D.fuels, COL = Object.fromEntries(FUELS.map(f => [f, css("--" + f)]));
const H = D.hours.length, Z = Object.fromEntries(D.zones.map(z => [z.id, z]));
const CABLE_OF = Object.fromEntries(Object.entries(D.cables).map(([c, b]) => [b, c]));
// schematic positions, roughly where each area lies
const POS = { NO4: [4.3, 0], SE1: [5.5, 0.35], NO3: [3.1, 1.05], SE2: [4.6, 1.45], FI: [6.7, 1.2], NO5: [1.65, 2.05], NO1: [2.9, 2.3],
  SE3: [4.3, 2.7], EE: [6.8, 2.7], NO2: [2.0, 3.45], LV: [6.8, 3.85], SE4: [4.55, 3.95], GB: [0.05, 4.7], DK1: [2.35, 4.7], DK2: [3.6, 4.85],
  LT: [6.55, 5.0], NL: [1.0, 6.05], DE: [2.75, 6.15], PL: [5.0, 6.1] };
const price = d3.scaleSequential([0, 250], d3.interpolateLab("#e8edf4", "#1c2c66")).clamp(true);
const val = (a, i) => a && a[i] != null ? a[i] : null;
const fmtMW = v => v == null ? "–" : Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(2).replace(/\.?0+$/, "") + " GW" : Math.round(Math.abs(v)) + " MW";
const fmtGW = v => v == null ? "–" : (v / 1000).toFixed(1) + " GW";
const dayName = s => new Date(s.slice(0, 10) + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const genOf = (z, i) => { const g = D.gen[z]; if (!g) return null; let s = 0, any = false; for (const f of FUELS) { const v = val(g[f], i); if (v != null) { s += v; any = true; } } return any ? s : null; };
const hasFc = i => Object.values(D.fc).some(a => val(a, i) != null);
const hasAuc = i => Object.values(D.auc).some(a => val(a, i) != null);
let cur = Math.max(0, D.last_measured), sel = "DK1", mode = "measured", chosen = false;
const towards = (f, z, v) => v == null ? null : (f.a === z ? v : -v);
function flowValue(f, i) {
  if (CABLE_OF[f.id]) {
    if (mode === "forecast") return { v: val(D.fc[f.id], i), kind: "forecast" };
    if (mode === "auction") return { v: val(D.auc[f.id], i), kind: "auction" };
    const m = val(f.v, i);
    if (m == null && i > D.last_measured) { const fc = val(D.fc[f.id], i); if (fc != null) return { v: fc, kind: "forecast" }; }
    return { v: m, kind: "measured" };
  }
  return { v: val(f.v, i), kind: "measured" };
}
document.getElementById("ramp").style.background = `linear-gradient(90deg, ${price(0)}, ${price(125)}, ${price(250)})`;

// ---------- map ----------
const svg = d3.select("#map");
let S = 1, T = 70, OX = 0, OY = 0;
const ctr = z => [OX + POS[z][0] * S + T / 2, OY + POS[z][1] * S + T / 2];
function drawMap() {
  const el = document.getElementById("map"), w = el.clientWidth, h = el.clientHeight;
  svg.attr("viewBox", `0 0 ${w} ${h}`).selectAll("*").remove();
  const xs = Object.values(POS).map(p => p[0]), ys = Object.values(POS).map(p => p[1]);
  const spanX = d3.max(xs) - d3.min(xs), spanY = d3.max(ys) - d3.min(ys);
  S = Math.min((w - 60) / (spanX + 0.75), (h - 70) / (spanY + 0.75));
  T = S * 0.72;
  OX = (w - (spanX * S + T)) / 2 - d3.min(xs) * S; OY = 22 + (h - 50 - (spanY * S + T)) / 2 - d3.min(ys) * S;
  svg.append("g").attr("id", "pipes");
  svg.append("g").attr("id", "tiles");
  svg.append("g").attr("id", "labels");
  render();
}

function render() {
  if (!svg.select("#pipes").node()) return;
  const flows = D.flows.filter(f => POS[f.a] && POS[f.b]);
  const width = v => v == null ? 1.5 : 2 + Math.min(Math.abs(v), 3000) / 3000 * T * 0.32;
  const pg = svg.select("#pipes").selectAll("g.p").data(flows, f => f.id).join(e => { const g = e.append("g").attr("class", "p"); g.append("line").attr("class", "pipe"); g.append("g").attr("class", "chevs"); return g; });
  const labels = [];
  pg.each(function (f) {
    const g = d3.select(this), { v, kind } = flowValue(f, cur);
    const mine = f.a === sel || f.b === sel, isFc = kind === "forecast" && v != null;
    let [x1, y1] = ctr(f.a), [x2, y2] = ctr(f.b);
    if (v != null && v < 0) [x1, y1, x2, y2] = [x2, y2, x1, y1];            // draw from where the power comes from
    const color = isFc ? css("--fc") : mine ? css("--sel") : css("--pipe");
    g.select(".pipe").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2).attr("stroke", v == null ? "#e1e6eb" : color)
      .attr("stroke-width", width(v)).attr("stroke-opacity", mine || isFc ? .9 : .45).attr("stroke-dasharray", isFc ? "7 5" : null);
    // chevrons pointing the way the power goes; more of them for more power
    const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const n = v == null ? 0 : Math.max(1, Math.min(4, Math.round(Math.abs(v) / 700)));
    const span = len - T * 0.9, start = (len - span) / 2;
    g.select(".chevs").attr("transform", `translate(${x1},${y1}) rotate(${ang})`).selectAll("path").data(d3.range(n)).join("path")
      .attr("class", "chev").attr("stroke", mine || isFc ? "#fff" : "#5d6b78").attr("stroke-opacity", mine || isFc ? .95 : .7)
      .attr("d", k => { const x = start + span * (k + 1) / (n + 1), s = Math.max(3, Math.min(6, width(v) * .45)); return `M${x - s / 2},${-s} L${x + s / 2},0 L${x - s / 2},${s}`; });
    if (mine && v != null && T >= 56) labels.push({ x: (x1 + x2) / 2, y: (y1 + y2) / 2, t: fmtMW(v), fc: isFc });
    if (mine) g.raise();
  });
  svg.select("#labels").selectAll("g").data(labels).join(e => { const g = e.append("g"); g.append("rect").attr("class", "mw-bg"); g.append("text").attr("class", "mw"); return g; })
    .each(function (l) {
      const g = d3.select(this), t = g.select("text").attr("x", l.x).attr("y", l.y + 4).attr("text-anchor", "middle").text(l.t).attr("fill", l.fc ? css("--fc") : css("--ink"));
      const w = l.t.length * 7 + 10;
      g.select("rect").attr("x", l.x - w / 2).attr("y", l.y - 9).attr("width", w).attr("height", 18).attr("rx", 9);
    });

  const tg = svg.select("#tiles").selectAll("g.tile").data(D.zones.filter(z => POS[z.id]), z => z.id).join(e => {
    const g = e.append("g").attr("class", "tile").attr("tabindex", 0).attr("role", "button");
    g.append("rect").attr("class", "bg"); g.append("g").attr("class", "mixbar"); g.append("rect").attr("class", "ring").attr("fill", "none");
    g.append("text").attr("class", "code"); g.append("text").attr("class", "p");
    g.on("click", (e, z) => pick(z.id)).on("keydown", (e, z) => { if (e.key === "Enter" || e.key === " ") { pick(z.id); e.preventDefault(); } });
    g.append("title");
    return g;
  });
  tg.classed("sel", z => z.id === sel).each(function (z) {
    const g = d3.select(this), x = OX + POS[z.id][0] * S, y = OY + POS[z.id][1] * S, p = val(D.price[z.id], cur);
    const fill = p == null ? "#eef1f4" : price(p), dark = p != null && d3.lab(fill).l < 58;
    g.attr("aria-label", `${z.id} ${z.name}, ${p == null ? "no price" : Math.round(p) + " euro per megawatt hour"}`);
    g.select("title").text(`${z.id} · ${z.name}`);
    g.select("rect.bg").attr("x", x).attr("y", y).attr("width", T).attr("height", T).attr("rx", 8).attr("fill", fill);
    g.select("rect.ring").attr("x", x - 1).attr("y", y - 1).attr("width", T + 2).attr("height", T + 2).attr("rx", 9).attr("stroke", z.id === sel ? css("--ink") : "none");
    const small = T < 56;                                   // on a phone the tile shows only its name; the colour is the price
    g.select(".code").attr("x", small ? x + T / 2 : x + 9).attr("y", small ? y + T / 2 + 4 : y + 8 + T * 0.18).attr("text-anchor", small ? "middle" : null)
      .style("font-size", (small ? Math.max(9, T * 0.28) : T * 0.17) + "px").attr("fill", dark ? "#fff" : css("--ink")).text(z.id);
    g.select(".p").attr("x", x + 9).attr("y", y + T * 0.66).style("font-size", T * 0.25 + "px").attr("fill", dark ? "#fff" : css("--ink")).text(small ? "" : p == null ? "–" : Math.round(p));
    // what it makes, as one thin stacked bar along the bottom
    const gen = D.gen[z.id] || {}, parts = FUELS.map(f => [f, Math.max(0, val(gen[f], cur) || 0)]), tot = d3.sum(parts, q => q[1]);
    let off = 0;
    g.select(".mixbar").selectAll("rect").data(tot && !small ? parts.filter(q => q[1] > 0) : []).join("rect")
      .attr("y", y + T - 9).attr("height", 5).attr("x", q => { const o = x + 8 + off; off += q[1] / tot * (T - 16); return o; })
      .attr("width", q => Math.max(0, q[1] / tot * (T - 16) - 1)).attr("fill", q => COL[q[0]]);
  });
}

// ---------- panel ----------
function panel(i) {
  const z = Z[sel], gen = D.gen[sel] || {}, g = genOf(sel, i), load = val(D.load[sel], i), p = val(D.price[sel], i);
  const bs = D.flows.filter(f => f.a === sel || f.b === sel).map(f => {
    const fv = flowValue(f, i), other = f.a === sel ? f.b : f.a;
    return { f, other, v: towards(f, sel, fv.v), kind: fv.kind, auc: towards(f, sel, val(D.auc[f.id], i)), fc: towards(f, sel, val(D.fc[f.id], i)), meas: towards(f, sel, val(f.v, i)) };
  }).filter(b => b.v != null).sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
  const net = bs.length && bs.every(b => b.kind === "measured") ? d3.sum(bs, b => b.v) : null;
  const parts = FUELS.map(f => [f, Math.max(0, val(gen[f], i) || 0)]).filter(q => q[1] > 0);
  let html = `<div class="card"><div class="zone-head"><h2>${z.id}</h2><span>${z.name}</span></div>
    <div class="price">${p == null ? "–" : Math.round(p)} <small>€/MWh</small></div>
    <div class="pair"><div>made<b>${fmtGW(g)}</b></div><div>used<b>${fmtGW(load)}</b></div></div>` +
    (parts.length ? `<div class="mix">${parts.map(q => `<i style="flex:${q[1]};background:${COL[q[0]]}" title="${FUEL_NAMES[q[0]]} ${fmtMW(q[1])}"></i>`).join("")}</div>
     <div class="mix-key">${parts.sort((a, b) => b[1] - a[1]).map(q => `<span><span class="sw" style="background:${COL[q[0]]}"></span>${FUEL_NAMES[q[0]]} ${Math.round(100 * q[1] / g)}%</span>`).join("")}</div>` : "") + `</div>`;
  html += `<div class="card"><p class="label">${net == null ? "flows" : net >= 0 ? `sends out ${fmtMW(net)} net` : `takes in ${fmtMW(net)} net`}</p><div class="flows">` +
    (bs.length ? bs.map(b => `<span class="dir" style="color:${b.kind === "forecast" ? css("--fc") : css("--sel")}">${b.v >= 0 ? "→" : "←"}</span>
      <span><button class="zbtn" data-z="${b.other}">${b.other}</button> <span style="color:var(--muted)">${Z[b.other].name}</span></span><span class="v">${fmtMW(b.v)}</span>` +
      (CABLE_OF[b.f.id] && (b.auc != null || b.fc != null) ? `<span class="sub">${[
        b.kind !== "auction" && b.auc != null ? `auction ${b.auc >= 0 ? "→" : "←"}${fmtMW(b.auc)}` : "",
        b.kind !== "forecast" && b.fc != null ? `<b>forecast ${b.fc >= 0 ? "→" : "←"}${fmtMW(b.fc)}</b>` : "",
        b.kind === "forecast" ? "<b>our forecast</b>" : ""].filter(Boolean).join(" · ")}</span>` : "")).join("")
    : `<span></span><span style="color:var(--muted)">not published yet</span><span></span>`) + `</div></div>`;
  html += `<div class="card record"><p class="label">DK1 forecast, error per cable and hour</p>${D.record_html}<p><a href="record.html">Record and backtest ›</a></p></div>`;
  const el = document.getElementById("panel"); el.innerHTML = html;
  el.querySelectorAll(".zbtn").forEach(b => b.onclick = () => pick(b.dataset.z));
}

// ---------- timeline ----------
const tl = d3.select("#tl");
let tx;
function drawTimeline() {
  const el = document.getElementById("tl"), w = el.clientWidth, h = el.clientHeight;
  tl.attr("viewBox", `0 0 ${w} ${h}`).selectAll("*").remove();
  const m = { l: 4, r: 44, t: 6 }, stackH = 104, stripTop = stackH + 24, stripH = h - stripTop - 18;
  tx = d3.scaleLinear([0, H - 1], [m.l, w - m.r]);
  const gen = D.gen[sel] || {}, load = D.load[sel] || [];
  const rows = D.hours.map((t, i) => Object.fromEntries(FUELS.map(f => [f, val(gen[f], i)])));
  const has = i => FUELS.some(f => rows[i][f] != null);
  const ymax = d3.max(D.hours, (t, i) => Math.max(has(i) ? d3.sum(FUELS, f => rows[i][f] || 0) : 0, val(load, i) || 0)) || 1;
  const y = d3.scaleLinear([0, ymax], [m.t + stackH, m.t]);
  D.hours.forEach((t, i) => { if (t.slice(11, 13) === "00") {
    tl.append("line").attr("x1", tx(i)).attr("x2", tx(i)).attr("y1", m.t).attr("y2", h - 14).attr("stroke", css("--hair"));
    tl.append("text").attr("x", tx(i) + 4).attr("y", h - 2).text(w < 700 ? dayName(t).split(" ")[1] : dayName(t));
  }});
  const stack = d3.stack().keys(FUELS).value((d, k) => d[k] || 0)(rows);
  const area = d3.area().defined((d, i) => has(i)).x((d, i) => tx(i)).y0(d => y(d[0])).y1(d => y(d[1])).curve(d3.curveStepAfter);
  tl.append("g").selectAll("path").data(stack).join("path").attr("d", area).attr("fill", d => COL[d.key]);
  tl.append("path").attr("d", d3.line().defined(v => v != null).x((v, i) => tx(i)).y(v => y(v)).curve(d3.curveStepAfter)(D.hours.map((t, i) => val(load, i))))
    .attr("fill", "none").attr("stroke", css("--ink")).attr("stroke-width", 1.3);
  tl.append("text").attr("x", w - m.r + 6).attr("y", m.t + 10).text(fmtGW(ymax));
  const ext = d3.extent([].concat(D.dk1_auc, D.dk1_fc).filter(v => v != null).concat([0]));
  const ys = d3.scaleLinear(ext, [stripTop + stripH, stripTop]).nice();
  tl.append("line").attr("x1", m.l).attr("x2", w - m.r).attr("y1", ys(0)).attr("y2", ys(0)).attr("stroke", css("--line"));
  const line = arr => d3.line().defined(v => v != null).x((v, i) => tx(i)).y(v => ys(v)).curve(d3.curveStepAfter)(arr);
  tl.append("path").attr("d", line(D.dk1_auc)).attr("fill", "none").attr("stroke", css("--ink")).attr("stroke-width", 1.3);
  tl.append("path").attr("d", line(D.dk1_fc)).attr("fill", "none").attr("stroke", css("--fc")).attr("stroke-width", 1.6).attr("stroke-dasharray", "4 3");
  tl.append("text").attr("x", m.l).attr("y", stripTop - 6).text("DK1 net export: ").append("tspan").style("fill", css("--ink")).text("auction ").append("tspan").style("fill", css("--fc")).text("- - forecast");
  tl.append("text").attr("x", w - m.r + 6).attr("y", stripTop + 8).text((ys.domain()[1] / 1000).toFixed(1) + " GW");
  tl.append("line").attr("id", "cursor").attr("y1", m.t).attr("y2", h - 14).attr("stroke", css("--sel")).attr("stroke-width", 2);
  document.getElementById("tl-title").innerHTML = `${sel}: what it makes, by fuel · line: what it uses · ` +
    FUELS.map(f => `<span class="sw" style="background:${COL[f]};margin-left:6px"></span>${FUEL_NAMES[f]}`).join(" ");
  moveCursor();
}
function moveCursor() { if (tx) d3.select("#cursor").attr("x1", tx(cur)).attr("x2", tx(cur)); }

// ---------- state ----------
function select(i) {
  cur = Math.max(0, Math.min(H - 1, i));
  const meas = cur <= D.last_measured;
  document.querySelectorAll("#mode button").forEach(b => { const m = b.dataset.mode;
    b.disabled = (m === "measured" && !meas) || (m === "auction" && !hasAuc(cur)) || (m === "forecast" && !hasFc(cur)); });
  const auto = meas ? "measured" : hasFc(cur) ? "forecast" : "measured";
  if (!chosen || document.querySelector(`#mode button[data-mode="${mode}"]`).disabled) setMode(auto, false);
  const t = D.hours[cur];
  document.getElementById("when").innerHTML = `${dayName(t)}, ${t.slice(11, 13)}:00` + (!meas && hasFc(cur) ? ` <em>forecast${D.fc_kind[cur] === "backfill" ? ", backfilled" : ""}</em>` : "");
  render(); panel(cur); moveCursor();
}
function setMode(m, re = true) { mode = m; document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === m)); if (re) { render(); panel(cur); } }
function pick(z) { if (!Z[z]) return; sel = z; drawTimeline(); select(cur); }
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { chosen = true; setMode(b.dataset.mode); });
const tlEl = document.getElementById("tl");
const pickHour = e => { const r = tlEl.getBoundingClientRect(); select(Math.round(tx.invert((e.clientX - r.left) * (tlEl.viewBox.baseVal.width / r.width)))); };
let drag = false;
tlEl.addEventListener("pointerdown", e => { drag = true; tlEl.setPointerCapture(e.pointerId); pickHour(e); });
tlEl.addEventListener("pointermove", e => { if (drag) pickHour(e); });
tlEl.addEventListener("pointerup", () => drag = false);
tlEl.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { select(cur + (e.shiftKey ? 24 : 1)); e.preventDefault(); }
  if (e.key === "ArrowLeft") { select(cur - (e.shiftKey ? 24 : 1)); e.preventDefault(); }
});
let timer = null;
document.getElementById("play").onclick = function () {
  if (timer) { clearInterval(timer); timer = null; this.textContent = "▶"; return; }
  this.textContent = "❚❚"; if (cur >= H - 1) cur = 0;
  timer = setInterval(() => { if (cur >= H - 1) { clearInterval(timer); timer = null; document.getElementById("play").textContent = "▶"; return; } select(cur + 1); }, 250);
};
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { drawMap(); drawTimeline(); }, 120); });
drawMap(); drawTimeline(); select(cur);
</script>
